<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameX</title>
<style>
:root{
  --bg:#0d0f14; --card:#171b24; --text:#f1f3f7; --muted:#9aa3b2;
  --green:#22c55e; --green-d:#16a34a; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
img{-webkit-user-drag:none;display:block}
a{color:inherit;text-decoration:none}

/* ===== Header ===== */
header{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 5%;background:var(--card);position:sticky;top:0;z-index:10;
}
.logo{font-size:1.6rem;font-weight:800;color:var(--green);cursor:pointer}

.container{max-width:1200px;margin:auto;padding:20px 5%}

/* ===== Slider (الصفحة الرئيسية) ===== */
.slider{
  position:relative;height:min(70vh,520px);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;background:#000;
}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .6s}
.slide.active{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover}
.slide-info{
  position:absolute;right:0;left:0;bottom:0;padding:40px 30px 30px;
  background:linear-gradient(transparent,rgba(0,0,0,.9));
}
.slide-info h2{font-size:clamp(1.4rem,4vw,2.4rem);margin-bottom:8px}
.slide-info p{color:#d6dbe5;max-width:640px;line-height:1.7}

.progress{position:absolute;top:0;right:0;left:0;height:5px;background:rgba(255,255,255,.2);z-index:2}
.progress span{display:block;height:100%;width:0;background:var(--green)}
.progress span.run{animation:fill 5s linear forwards}
@keyframes fill{to{width:100%}}

.section-title{margin:40px 0 18px;font-size:1.4rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover}
.card h3{padding:12px 14px;font-size:1.05rem}

/* ===== صفحة اللعبة ===== */
.back{display:inline-block;margin-bottom:20px;color:var(--muted)}
.back:hover{color:var(--green)}
.game-top{
  display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center;
}
/* في RTL: أول عنصر = اليمين (الفيديو)، ثاني عنصر = الشمال (الزر) */
.video-box video{width:100%;border-radius:var(--radius);background:#000;aspect-ratio:16/9}
.info-box h1{font-size:clamp(1.6rem,4vw,2.4rem);margin-bottom:14px}
.comment{color:#cfd5e0;line-height:1.9;margin-bottom:24px}
.dl-btn{
  display:inline-block;padding:16px 36px;border-radius:12px;
  background:var(--green);color:#052e16;font-weight:800;font-size:1.1rem;
  transition:background .2s, transform .2s;
}
.dl-btn:hover{background:var(--green-d);transform:scale(1.03)}

.specs{margin-top:40px;background:var(--card);border-radius:var(--radius);padding:26px}
.specs h2{margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid #262c3a;color:var(--green)}
.spec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.spec{background:var(--bg);padding:14px 16px;border-radius:10px;display:flex;justify-content:space-between;gap:10px}
.spec span{color:var(--muted)}
.spec strong{font-weight:600}

/* ===== Responsive ===== */
@media (max-width:768px){
  .game-top{grid-template-columns:1fr}
  .dl-btn{width:100%;text-align:center}
  .slide-info{padding:25px 18px}
}
</style>
</head>
<body>

<header>
  <a href="#" class="logo">GameX</a>
</header>

<main id="app" class="container"></main>

<script>
/* ============================================================
   بيانات الألعاب - عدّل هنا فقط
   img      : صورة الغلاف
   video    : رابط الفيديو (mp4)
   comment  : التعليق على اللعبة
   download : رابط التحميل
   specs    : المواصفات (اسم الخاصية: القيمة)
   ============================================================ */
const games = [
  {
    id: 1,
    title: "Cyber Rush",
    img: "https://placehold.co/1280x720/1e293b/22c55e?text=Cyber+Rush",
    video: "videos/cyber-rush.mp4",
    comment: "لعبة أكشن سريعة في عالم مستقبلي، فيها جرافيك خرافي وقصة مشوقة تخليك مش عايز تسيبها.",
    download: "https://example.com/download/cyber-rush",
    specs: {
      "المطور": "Neon Studio",
      "الحجم": "12 GB",
      "نظام التشغيل": "Windows 10 / 11",
      "المعالج": "Intel i5 أو ما يعادله",
      "الرام": "8 GB",
      "كرت الشاشة": "GTX 1060",
      "التخزين": "SSD مفضل"
    }
  },
  {
    id: 2,
    title: "Dragon Quest X",
    img: "https://placehold.co/1280x720/3b1d1d/f97316?text=Dragon+Quest+X",
    video: "videos/dragon-quest.mp4",
    comment: "مغامرة RPG واسعة مليانة وحوش وكنوز، واختار طريقك وأسلوب لعبك بالكامل.",
    download: "https://example.com/download/dragon-quest",
    specs: {
      "المطور": "Ember Games",
      "الحجم": "25 GB",
      "نظام التشغيل": "Windows 10 / 11",
      "المعالج": "Intel i7",
      "الرام": "16 GB",
      "كرت الشاشة": "RTX 2060",
      "التخزين": "SSD"
    }
  },
  {
    id: 3,
    title: "Racing Legends",
    img: "https://placehold.co/1280x720/102a43/38bdf8?text=Racing+Legends",
    video: "videos/racing-legends.mp4",
    comment: "سباقات سرعة بأشهر السيارات، وفيزياء حقيقية وتحديات أونلاين مع أصحابك.",
    download: "https://example.com/download/racing-legends",
    specs: {
      "المطور": "Velocity Team",
      "الحجم": "18 GB",
      "نظام التشغيل": "Windows 10 / 11",
      "المعالج": "Intel i5",
      "الرام": "8 GB",
      "كرت الشاشة": "GTX 1660",
      "التخزين": "SSD"
    }
  }
];

const app = document.getElementById('app');
let idx = 0;
let timer = null;

/* ================= الصفحة الرئيسية ================= */
function renderHome() {
  app.innerHTML = `
    <div class="slider" id="slider">
      <div class="progress"><span id="bar"></span></div>
      ${games.map((g, i) => `
        <div class="slide" data-i="${i}">
          <img src="${g.img}" alt="${g.title}">
          <div class="slide-info">
            <h2>${g.title}</h2>
            <p>${g.comment}</p>
          </div>
        </div>`).join('')}
    </div>

    <h2 class="section-title">كل الألعاب</h2>
    <div class="grid">
      ${games.map(g => `
        <a class="card" href="#game-${g.id}">
          <img src="${g.img}" alt="${g.title}">
          <h3>${g.title}</h3>
        </a>`).join('')}
    </div>
  `;

  document.getElementById('slider').onclick = () => {
    location.hash = '#game-' + games[idx].id;
  };

  showSlide(0);
}

function showSlide(i) {
  idx = i;
  document.querySelectorAll('.slide').forEach((s, n) => {
    s.classList.toggle('active', n === i);
  });

  // إعادة تشغيل شريط التقدم
  const bar = document.getElementById('bar');
  bar.classList.remove('run');
  void bar.offsetWidth;
  bar.classList.add('run');

  // كل لعبة 5 ثواني
  clearTimeout(timer);
  timer = setTimeout(() => showSlide((i + 1) % games.length), 5000);
}

/* ================= صفحة اللعبة ================= */
function renderGame(id) {
  clearTimeout(timer);
  const g = games.find(x => x.id === id);
  if (!g) { location.hash = ''; return; }

  const specs = Object.entries(g.specs).map(([k, v]) => `
    <div class="spec"><span>${k}</span><strong>${v}</strong></div>`).join('');

  app.innerHTML = `
    <a class="back" href="#">→ رجوع</a>

    <div class="game-top">
      <div class="video-box">
        <video src="${g.video}" poster="${g.img}" controls
               controlsList="nodownload" oncontextmenu="return false"></video>
      </div>

      <div class="info-box">
        <h1>${g.title}</h1>
        <p class="comment">${g.comment}</p>
        <a class="dl-btn" href="${g.download}" target="_blank" rel="noopener">⬇ تحميل اللعبة</a>
      </div>
    </div>

    <section class="specs">
      <h2>تنزيل</h2>
      <div class="spec-grid">${specs}</div>
    </section>
  `;
  window.scrollTo(0, 0);
}

/* ================= التوجيه ================= */
function route() {
  const h = location.hash;
  if (h.startsWith('#game-')) {
    renderGame(parseInt(h.slice(6), 10));
  } else {
    renderHome();
  }
}
window.addEventListener('hashchange', route);
route();

/* ================= منع النسخ ================= */
['copy', 'cut', 'contextmenu', 'dragstart'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault())
);
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && ['c', 'x', 'u', 's', 'a', 'p'].includes(e.key.toLowerCase())) {
    e.preventDefault();
  }
});
</script>
</body>
</html>
